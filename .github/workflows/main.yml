name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build
        run: gradle build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ascension-rings-jar
          path: build/libs/*.jar

      - name: Release (เมื่อ push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar

      - name: อัปเดต Release "latest" อัตโนมัติ (ให้ดาวน์โหลดไฟล์ล่าสุดด้วยลิงก์ตายตัว)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/ascension-rings-*.jar | grep -v -- '-sources' | head -n 1)
          cp "$JAR" build/libs/ascension-rings.jar
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/ascension-rings.jar --title "Latest build" --notes "Auto-built from ${{ github.sha }}" --target ${{ github.sha }}
